# Local Postgres for development. In PRODUCTION, run the database on an
# EU-region managed Postgres (e.g. Frankfurt/Dublin) so health data never
# leaves the EU. btree_gist + pgcrypto are created by the migrations.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: virthy
      POSTGRES_PASSWORD: virthy
      POSTGRES_DB: virthy
    ports:
      - '5432:5432'
    volumes:
      - virthy_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U virthy']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  virthy_pg:
